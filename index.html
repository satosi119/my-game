<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>5x5 대각선 과일 매치 (8방향)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background-color: #0F172A; color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 10px;
    }
    header { text-align: center; width: 100%; max-width: 420px; margin-bottom: 6px; }
    h1 { font-size: 20px; color: #4ADE80; margin-bottom: 4px; }
    .stats-board {
      display: flex; justify-content: space-around; background: #1E293B;
      padding: 6px 12px; border-radius: 10px; border: 1px solid #334155;
    }
    .stat-item { font-size: 14px; }
    .stat-value { font-weight: bold; color: #FACC15; }

    /* 퍼즐 판 */
    .puzzle-container {
      width: 100%; max-width: 420px; height: calc(100vh - 160px); max-height: 520px;
      background: #090D16; border: 3px solid #334155; border-radius: 14px;
      display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
      gap: 4px; padding: 6px; position: relative;
    }

    /* 타일 (직사각형 테두리) */
    .tile {
      background: #1E293B; border: 2px solid #2563EB; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 32px; position: relative;
      transition: background-color 0.1s, transform 0.1s;
    }
    .tile.selected { background-color: #334155; transform: scale(1.05); border-color: #FACC15; }
    .tile.match { animation: matchPop 0.3s ease-out forwards; }

    @keyframes matchPop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.5; }
      100% { transform: scale(0); opacity: 0; }
    }

    /* 하단 버튼 (퍼즐과 같이 보임) */
    .control-panel { width: 100%; max-width: 420px; display: flex; gap: 8px; margin-top: 6px; }
    .btn {
      flex: 1; padding: 12px; font-size: 15px; font-weight: bold;
      border: none; border-radius: 10px; cursor: pointer; color: white;
      transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-shuffle { background-color: #2563EB; }
    .btn-reset { background-color: #EF4444; }
    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>🍎 대각선 과일 매치 (5x5)</h1>
    <div class="stats-board">
      <div class="stat-item">점수: <span id="score" class="stat-value">0</span></div>
      <div class="stat-item">시간: <span id="timer" class="stat-value">00:00</span></div>
    </div>
  </header>

  <div class="puzzle-container" id="board"></div>

  <div class="control-panel">
    <button class="btn btn-shuffle" id="shuffleBtn" onclick="shuffleBoard()">🔀 퍼즐 섞기</button>
    <button class="btn btn-reset" onclick="resetGame()">🔄 다시 시작</button>
  </div>

  <script>
    const FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍊'];
    const GRID_SIZE = 5;
    let board = [];
    let score = 0;
    let timerSeconds = 0;
    let timerInterval = null;
    let selectedTileIdx = null;
    let isProcessing = false; // 매칭 중 조작 방지

    function initGame() {
      score = 0;
      document.getElementById('score').textContent = score;
      resetTimer();
      createBoard();
      startTimer();
    }

    // 1. 초기 보드 생성 (3개 조합 안 생기도록 검사)
    function createBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      board = [];

      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        let fruit;
        do {
          fruit = FRUITS[Math.floor(Math.random() * FRUITS.length)];
          board[i] = fruit;
        } while (isInitialMatch(i)); // 터지는 조합이면 다시 뽑기
        
        const tile = document.createElement('div');
        tile.classList.add('tile');
        tile.id = `tile-${i}`;
        tile.textContent = fruit;
        tile.onclick = () => handleTileClick(i);
        boardEl.appendChild(tile);
      }
    }

    // 초기 배치 매치 검사 (터지지 않도록)
    function isInitialMatch(idx) {
      const row = Math.floor(idx / GRID_SIZE);
      const col = idx % GRID_SIZE;
      const fruit = board[idx];

      // 가로 검사 (왼쪽 2개)
      if (col >= 2 && board[idx-1] === fruit && board[idx-2] === fruit) return true;
      // 세로 검사 (위쪽 2개)
      if (row >= 2 && board[idx-GRID_SIZE] === fruit && board[idx-GRID_SIZE*2] === fruit) return true;
      // 대각선 검사 (왼쪽 위 2개)
      if (col >= 2 && row >= 2 && board[idx-GRID_SIZE-1] === fruit && board[idx-GRID_SIZE*2-2] === fruit) return true;
      // 대각선 검사 (오른쪽 위 2개)
      if (col <= GRID_SIZE-3 && row >= 2 && board[idx-GRID_SIZE+1] === fruit && board[idx-GRID_SIZE*2+2] === fruit) return true;

      return false;
    }

    // 타일 터치 핸들러 (8방향 대각선 이동 로직)
    async function handleTileClick(idx) {
      if (isProcessing) return; // 애니메이션 중 클릭 방지

      const tileEl = document.getElementById(`tile-${idx}`);

      if (selectedTileIdx === null) {
        // 첫 번째 타일 선택
        selectedTileIdx = idx;
        tileEl.classList.add('selected');
      } else {
        const prevTileIdx = selectedTileIdx;
        const prevTileEl = document.getElementById(`tile-${prevTileIdx}`);
        
        // 인접성 검사 (8방향: 가로, 세로, 대각선)
        const row1 = Math.floor(prevTileIdx / GRID_SIZE);
        const col1 = prevTileIdx % GRID_SIZE;
        const row2 = Math.floor(idx / GRID_SIZE);
        const col2 = idx % GRID_SIZE;

        const rowDiff = Math.abs(row1 - row2);
        const colDiff = Math.abs(col1 - col2);

        // 8방향 이웃 확인 로직
        const isNeighbor = (rowDiff <= 1 && colDiff <= 1) && !(rowDiff === 0 && colDiff === 0);

        if (isNeighbor && prevTileIdx !== idx) {
          // 8방향 이웃이면 위치 바꾸기
          isProcessing = true;
          prevTileEl.classList.remove('selected');
          selectedTileIdx = null;
          
          // 임시 변경
          swapTiles(prevTileIdx, idx);
          
          // 매치 검사
          const matches = getAllMatches();
          if (matches.size > 0) {
            // 매치가 있으면 터뜨리기 프로세스 시작
            await handleMatches();
          } else {
            // 매치가 없으면 다시 되돌리기
            swapTiles(prevTileIdx, idx);
            isProcessing = false;
          }
        } else {
          // 이웃이 아니거나 같은 타일이면 선택 취소 또는 변경
          prevTileEl.classList.remove('selected');
          if (prevTileIdx === idx) {
            selectedTileIdx = null;
          } else {
            selectedTileIdx = idx;
            tileEl.classList.add('selected');
          }
        }
      }
    }

    // 보드 데이터 및 데이터 교체
    function swapTiles(idx1, idx2) {
      const tile1El = document.getElementById(`tile-${idx1}`);
      const tile2El = document.getElementById(`tile-${idx2}`);
      
      // 데이터 교체
      [board[idx1], board[idx2]] = [board[idx2], board[idx1]];
      
      // 화면 교체
      tile1El.textContent = board[idx1];
      tile2El.textContent = board[idx2];
    }

    // 전체 보드 매치 확인 (8방향)
    function getAllMatches() {
      const matchedIndices = new Set();

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const idx = r * GRID_SIZE + c;
          const fruit = board[idx];
          if (!fruit) continue;

          // 1. 가로 (오른쪽으로)
          if (c <= GRID_SIZE - 3) {
            if (board[idx+1] === fruit && board[idx+2] === fruit) {
              matchedIndices.add(idx); matchedIndices.add(idx+1); matchedIndices.add(idx+2);
            }
          }
          // 2. 세로 (아래쪽으로)
          if (r <= GRID_SIZE - 3) {
            if (board[idx+GRID_SIZE] === fruit && board[idx+GRID_SIZE*2] === fruit) {
              matchedIndices.add(idx); matchedIndices.add(idx+GRID_SIZE); matchedIndices.add(idx+GRID_SIZE*2);
            }
          }
          // 3. 대각선 (오른쪽 아래)
          if (c <= GRID_SIZE - 3 && r <= GRID_SIZE - 3) {
            if (board[idx+GRID_SIZE+1] === fruit && board[idx+GRID_SIZE*2+2] === fruit) {
              matchedIndices.add(idx); matchedIndices.add(idx+GRID_SIZE+1); matchedIndices.add(idx+GRID_SIZE*2+2);
            }
          }
          // 4. 대각선 (왼쪽 아래)
          if (c >= 2 && r <= GRID_SIZE - 3) {
            if (board[idx+GRID_SIZE-1] === fruit && board[idx+GRID_SIZE*2-2] === fruit) {
              matchedIndices.add(idx); matchedIndices.add(idx+GRID_SIZE-1); matchedIndices.add(idx+GRID_SIZE*2-2);
            }
          }
        }
      }
      return matchedIndices;
    }

    // 매치 터뜨리기, 점수, 채우기 프로세스
    async function handleMatches() {
      const matches = getAllMatches();
      if (matches.size === 0) {
        isProcessing = false;
        return;
      }

      // 1. 애니메이션 표시 및 점수 획득
      matches.forEach(idx => {
        document.getElementById(`tile-${idx}`).classList.add('match');
      });
      score += matches.size * 10;
      document.getElementById('score').textContent = score;

      await new Promise(res => setTimeout(res, 300)); // 애니메이션 시간 대기

      // 2. 데이터에서 제거 (null) 및 화면 갱신
      matches.forEach(idx => {
        board[idx] = null;
        const tileEl = document.getElementById(`tile-${idx}`);
        tileEl.textContent = '';
        tileEl.classList.remove('match');
      });

      await new Promise(res => setTimeout(res, 100));

      // 3. 위에 있는 타일 아래로 내리기 및 새 타일 채우기
      dropAndFillTiles();

      // 4. 연쇄 반응 검사
      setTimeout(handleMatches, 400); 
    }

    // 타일 내리고 위에 새 과일 채우기
    function dropAndFillTiles() {
      for (let c = 0; c < GRID_SIZE; c++) {
        let emptyRow = GRID_SIZE - 1;
        // 아래서부터 빈칸 찾기
        for (let r = GRID_SIZE - 1; r >= 0; r--) {
          const idx = r * GRID_SIZE + c;
          if (board[idx] !== null) {
            if (r !== emptyRow) {
              // 위에 있는 과일을 빈칸으로 이동
              const targetIdx = emptyRow * GRID_SIZE + c;
              board[targetIdx] = board[idx];
              board[idx] = null;
              document.getElementById(`tile-${targetIdx}`).textContent = board[targetIdx];
              document.getElementById(`tile-${idx}`).textContent = '';
            }
            emptyRow--;
          }
        }
        // 나머지 위쪽 빈칸에 새 과일 채우기
        for (let r = emptyRow; r >= 0; r--) {
          const idx = r * GRID_SIZE + c;
          // 조합 방지 로직 (여기서는 단순화하여 랜덤 채움 후 handleMatches에서 재검사)
          board[idx] = FRUITS[Math.floor(Math.random() * FRUITS.length)];
          document.getElementById(`tile-${idx}`).textContent = board[idx];
        }
      }
    }

    // 퍼즐 섞기 (3개 조합 안 나오도록 보장)
    function shuffleBoard() {
      if (isProcessing) return;
      isProcessing = true;
      if (selectedTileIdx !== null) {
        document.getElementById(`tile-${selectedTileIdx}`).classList.remove('selected');
        selectedTileIdx = null;
      }
      resetTimer();
      createBoard(); // createBoard 내부 조합 방지 로직 활용
      isProcessing = false;
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerSeconds = 0;
      document.getElementById('timer').textContent = '00:00';
    }

    function resetGame() {
      initGame();
    }

    initGame();
  </script>
</body>
</html>
