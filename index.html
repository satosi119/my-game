<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>우드 블록 IQ 퍼즐</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background-color: #26170B; color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 10px; overflow: hidden;
      background-image: radial-gradient(circle, #3D2314 0%, #1A0F07 100%);
    }
    header { text-align: center; margin-bottom: 12px; }
    .iq-board {
      background: #DEB887; color: #3A2208; padding: 6px 20px; border-radius: 8px;
      font-size: 20px; font-weight: 900; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
      border: 3px solid #8B5A2B; margin-bottom: 15px; letter-spacing: 1px;
    }
    
    /* 게임 플레이 영역 (우드 감성) */
    .game-container {
      position: relative; width: 360px; height: 360px;
      background: #8B5A2B; border: 6px solid #5C3A21; border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 5px 15px rgba(0,0,0,0.4);
      display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr);
      gap: 2px; padding: 4px;
    }

    /* 슬롯 칸 */
    .slot {
      background: #4E311B; border-radius: 4px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }
    .slot.target {
      background: #2C1A0E;
      border: 1px dashed rgba(255,255,255,0.15);
    }

    /* 나무 블록 스타일 */
    .wood-block {
      position: absolute; display: grid; gap: 2px; cursor: grab;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
      transition: transform 0.1s ease;
    }
    .wood-block:active { cursor: grabbing; transform: scale(1.05); }
    
    .wood-cell {
      background: linear-gradient(135deg, #DEB887 0%, #C49A6C 50%, #A07144 100%);
      border-radius: 4px; border: 1px solid #8B5A2B;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), inset 0 -2px 3px rgba(0,0,0,0.3);
    }

    /* 하단 제어판 */
    .control-panel { margin-top: 20px; display: flex; gap: 10px; }
    .btn {
      padding: 10px 20px; font-size: 14px; font-weight: bold;
      background: #D97706; color: white; border: none; border-radius: 8px;
      cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: translateY(2px); background: #B45309; }

    /* 클리어 메시지 팝업 */
    #clearMsg {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
      background: rgba(0,0,0,0.85); padding: 25px 40px; border-radius: 16px;
      border: 3px solid #FACC15; text-align: center; font-size: 22px; font-weight: bold;
      color: #FACC15; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100; pointer-events: none;
    }
    #clearMsg.show { transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>

  <header>
    <div class="iq-board" id="iqDisplay">IQ = 49</div>
  </header>

  <!-- 퍼즐 보드 (6x6 격자 기준 구멍 홈 배치) -->
  <div class="game-container" id="gameContainer"></div>

  <div class="control-panel">
    <button class="btn" onclick="resetPuzzle()">🔄 다시 하기</button>
  </div>

  <div id="clearMsg">🎉 퍼즐 완성! IQ 테스트 통과! 🎉</div>

  <script>
    // 십자 형태의 구멍 좌표 정의 (총 14칸 홈)
    const targetCells = [
      {r: 1, c: 2}, {r: 1, c: 3},
      {r: 2, c: 1}, {r: 2, c: 2}, {r: 2, c: 3}, {r: 2, c: 4},
      {r: 3, c: 1}, {r: 3, c: 2}, {r: 3, c: 3}, {r: 3, c: 4},
      {r: 4, c: 2}, {r: 4, c: 3},
      {r: 5, c: 2}, {r: 5, c: 3}
    ];

    // 블록 정의 (상대 좌표 형태, 초기 배치 위치 px 포함)
    let blocksData = [
      { id: 'b1', shape: [[0,0], [1,0], [2,0], [2,1]], startX: 20, startY: 410 },
      { id: 'b2', shape: [[0,0], [0,1], [1,1], [2,1]], startX: 135, startY: 410 },
      { id: 'b3', shape: [[0,1], [1,0], [1,1]], startX: 250, startY: 410 },
    ];

    const container = document.getElementById('gameContainer');
    const cellSize = 56; // 6x6 그리드 한 칸의 크기 (px)
    const boardOffset = 6; // 컨테이너 패딩

    function initGame() {
      container.innerHTML = '';
      
      // 6x6 슬롯 및 타겟 홈 생성
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          const slot = document.createElement('div');
          slot.classList.add('slot');
          const isTarget = targetCells.some(t => t.r === r && t.c === c);
          if (isTarget) slot.classList.add('target');
          container.appendChild(slot);
        }
      }

      // 블록 DOM 생성 및 드래그 이벤트 연결
      blocksData.forEach(b => {
        const el = document.createElement('div');
        el.className = 'wood-block';
        el.id = b.id;
        
        // 블록 형태 크기 계산
        const maxR = Math.max(...b.shape.map(p => p[0]));
        const maxC = Math.max(...b.shape.map(p => p[1]));
        el.style.gridTemplateRows = `repeat(${maxR + 1}, ${cellSize}px)`;
        el.style.gridTemplateColumns = `repeat(${maxC + 1}, ${cellSize}px)`;
        el.style.width = `${(maxC + 1) * cellSize}px`;
        el.style.height = `${(maxR + 1) * cellSize}px`;

        b.shape.forEach(([r, c]) => {
          const cell = document.createElement('div');
          cell.className = 'wood-cell';
          cell.style.gridRow = r + 1;
          cell.style.gridColumn = c + 1;
          el.appendChild(cell);
        });

        // 초기 위치 설정
        el.style.left = `${b.startX}px`;
        el.style.top = `${b.startY}px`;

        makeDraggable(el, b);
        document.body.appendChild(el);
      });

      document.getElementById('clearMsg').classList.remove('show');
    }

    // 드래그 앤 드롭 구현 (마우스 및 터치 지원)
    function makeDraggable(element, blockInfo) {
      let shiftX, shiftY;

      function moveAt(pageX, pageY) {
        element.style.left = `${pageX - shiftX}px`;
        element.style.top = `${pageY - shiftY}px`;
      }

      function onMouseMove(event) {
        moveAt(event.pageX, event.pageY);
      }

      function onTouchMove(event) {
        moveAt(event.touches[0].pageX, event.touches[0].pageY);
      }

      function onDragEnd(event) {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onDragEnd);
        document.removeEventListener('touchmove', onTouchMove);
        document.removeEventListener('touchend', onDragEnd);

        snapToGrid(element, blockInfo);
        checkWinCondition();
      }

      element.addEventListener('mousedown', (e) => {
        shiftX = e.clientX - element.getBoundingClientRect().left;
        shiftY = e.clientY - element.getBoundingClientRect().top;
        element.style.zIndex = 1000;
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onDragEnd);
        e.preventDefault();
      });

      element.addEventListener('touchstart', (e) => {
        shiftX = e.touches[0].clientX - element.getBoundingClientRect().left;
        shiftY = e.touches[0].clientY - element.getBoundingClientRect().top;
        element.style.zIndex = 1000;
        document.addEventListener('touchmove', onTouchMove, { passive: false });
        document.addEventListener('touchend', onDragEnd);
        e.preventDefault();
      });
    }

    // 보드판 그리드 위치에 스냅(자석처럼 딱 맞추기)
    function snapToGrid(element, blockInfo) {
      const containerRect = container.getBoundingClientRect();
      const elemRect = element.getBoundingClientRect();

      // 보드 내부 상대 좌표 계산
      const relX = elemRect.left - containerRect.left;
      const relY = elemRect.top - containerRect.top;

      const targetCol = Math.round(relX / cellSize);
      const targetRow = Math.round(relY / cellSize);

      // 보드 범위 안에 들어오면 스냅, 아니면 원래 대기 위치로 복귀
      if (targetCol >= 0 && targetRow >= 0 && targetCol <= 6 && targetRow <= 6) {
        element.style.left = `${containerRect.left + targetCol * cellSize - boardOffset}px`;
        element.style.top = `${containerRect.top + targetRow * cellSize - boardOffset}px`;
        blockInfo.currentGrid = { r: targetRow, c: targetCol };
      } else {
        element.style.left = `${blockInfo.startX}px`;
        element.style.top = `${blockInfo.startY}px`;
        blockInfo.currentGrid = null;
      }
      element.style.zIndex = 10;
    }

    // 승리 조건 체크 (구멍 칸을 블록들이 정확히 채웠는지 확인)
    function checkWinCondition() {
      let filledSlots = new Set();
      let overlap = false;

      blocksData.forEach(b => {
        if (!b.currentGrid) return;
        b.shape.forEach(([r, c]) => {
          const boardR = b.currentGrid.r + r;
          const boardC = b.currentGrid.c + c;
          const key = `${boardR},${boardC}`;
          if (filledSlots.has(key)) overlap = true;
          filledSlots.add(key);
        });
      });

      if (overlap) return;

      // 모든 타겟 칸이 정확히 채워졌는지 검증
      const allTargetFilled = targetCells.every(t => filledSlots.has(`${t.r},${t.c}`)) && filledSlots.size === targetCells.length;

      if (allTargetFilled) {
        document.getElementById('iqDisplay').textContent = "IQ = 150+ (CLEAR!)";
        document.getElementById('clearMsg').classList.add('show');
      }
    }

    function resetPuzzle() {
      // 기존 동적 생성된 블록 엘리먼트 제거 후 재생성
      document.querySelectorAll('.wood-block').forEach(el => el.remove());
      blocksData.forEach(b => delete b.currentGrid);
      initGame();
    }

    initGame();
  </script>
</body>
</html>
