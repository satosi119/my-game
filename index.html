<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>5x5 대각선 과일 퍼즐</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0F172A;
      color: #ffffff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 12px 10px;
    }
    header {
      text-align: center;
      width: 100%;
      max-width: 420px;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 20px;
      color: #4ADE80;
      margin-bottom: 6px;
    }
    .stats-board {
      display: flex;
      justify-content: space-around;
      background: #1E293B;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
    }
    .stat-item {
      font-size: 14px;
    }
    .stat-value {
      font-weight: bold;
      color: #FACC15;
    }

    /* 5x5 퍼즐 판 (스마트폰 전체 화면에 긴 세로 비율) */
    .puzzle-container {
      width: 100%;
      max-width: 420px;
      height: calc(100vh - 160px);
      max-height: 620px;
      background: #090D16;
      border: 3px solid #334155;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 4px;
      padding: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
    }

    /* 퍼즐 타일 (세로로 긴 직사각형 & 파란색 칸막이 테두리) */
    .tile {
      background: #1E293B;
      border: 2px solid #2563EB;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.12s ease, background-color 0.15s;
    }
    .tile:active {
      transform: scale(0.95);
      background-color: #334155;
    }
    .tile.empty {
      background: #0F172A;
      border: 2px dashed #475569;
      cursor: default;
    }
    .tile-num {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 11px;
      font-weight: bold;
      color: #94A3B8;
    }
    .tile-icon {
      font-size: 28px;
      margin-top: 6px;
    }

    /* 하단 버튼 */
    .control-panel {
      width: 100%;
      max-width: 420px;
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: white;
      transition: opacity 0.2s;
    }
    .btn-shuffle { background-color: #2563EB; }
    .btn-reset { background-color: #EF4444; }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <header>
    <h1>🍎 대각선 과일 퍼즐 (5x5)</h1>
    <div class="stats-board">
      <div class="stat-item">이동 횟수: <span id="moves" class="stat-value">0</span>회</div>
      <div class="stat-item">소요 시간: <span id="timer" class="stat-value">00:00</span></div>
    </div>
  </header>

  <!-- 퍼즐 판 -->
  <div class="puzzle-container" id="board"></div>

  <!-- 조작 버튼 -->
  <div class="control-panel">
    <button class="btn btn-shuffle" onclick="shuffleBoard()">🔀 퍼즐 섞기</button>
    <button class="btn btn-reset" onclick="resetGame()">🔄 다시 시작</button>
  </div>

  <script>
    const FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍊'];
    let board = [];
    let moves = 0;
    let timerSeconds = 0;
    let timerInterval = null;

    function initGame() {
      // 1~24번 퍼즐 조각 (25번째는 빈칸 0)
      board = Array.from({length: 24}, (_, i) => i + 1);
      board.push(0);
      moves = 0;
      document.getElementById('moves').textContent = moves;
      resetTimer();
      renderBoard();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';

      board.forEach((val, idx) => {
        const tile = document.createElement('div');
        tile.classList.add('tile');
        
        if (val === 0) {
          tile.classList.add('empty');
        } else {
          const fruit = FRUITS[(val - 1) % 5];
          tile.innerHTML = `
            <span class="tile-num">${val}</span>
            <span class="tile-icon">${fruit}</span>
          `;
          tile.onclick = () => moveTile(idx);
        }
        boardEl.appendChild(tile);
      });
    }

    // 이동 가능 로직 (상하좌우 + 대각선 8방향)
    function moveTile(idx) {
      const emptyIdx = board.indexOf(0);
      const row = Math.floor(idx / 5);
      const col = idx % 5;
      const emptyRow = Math.floor(emptyIdx / 5);
      const emptyCol = emptyIdx % 5;

      const rowDiff = Math.abs(row - emptyRow);
      const colDiff = Math.abs(col - emptyCol);

      // 상하좌우(1칸 차이) 또는 대각선(가로1칸 + 세로1칸 차이) 모두 이동 허용
      const isMovable = (rowDiff <= 1 && colDiff <= 1) && !(rowDiff === 0 && colDiff === 0);

      if (isMovable) {
        if (moves === 0 && !timerInterval) startTimer();
        [board[idx], board[emptyIdx]] = [board[emptyIdx], board[idx]];
        moves++;
        document.getElementById('moves').textContent = moves;
        renderBoard();
        checkWin();
      }
    }

    function shuffleBoard() {
      for (let i = 0; i < 250; i++) {
        const emptyIdx = board.indexOf(0);
        const validMoves = [];
        const emptyRow = Math.floor(emptyIdx / 5);
        const emptyCol = emptyIdx % 5;

        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            const rowDiff = Math.abs(r - emptyRow);
            const colDiff = Math.abs(c - emptyCol);
            if ((rowDiff <= 1 && colDiff <= 1) && !(rowDiff === 0 && colDiff === 0)) {
              validMoves.push(r * 5 + c);
            }
          }
        }

        const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
        [board[emptyIdx], board[randomMove]] = [board[randomMove], board[emptyIdx]];
      }
      moves = 0;
      document.getElementById('moves').textContent = moves;
      resetTimer();
      renderBoard();
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const secs = String(timerSeconds % 60).padStart(2, '0');
        document.getElementById('timer').textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerSeconds = 0;
      document.getElementById('timer').textContent = '00:00';
    }

    function resetGame() {
      initGame();
    }

    function checkWin() {
      const isWin = board.slice(0, 24).every((val, i) => val === i + 1);
      if (isWin) {
        clearInterval(timerInterval);
        setTimeout(() => alert(`🎉 축하합니다! 퍼즐을 완벽하게 맞추셨습니다!\n총 이동 횟수: ${moves}회`), 100);
      }
    }

    initGame();
  </script>
</body>
</html>
